
name: Deploy Yii3 Applications

on:
  push:
    branches:
      - sys-development
      - main

  workflow_dispatch:

# Keep deployments separate for each branch.
concurrency:
  group: yii3-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================
  # EXISTING SERVER - FTP DEPLOYMENT
  # Trigger: sys-development branch
  # ==========================================
  deploy-existing-server:
    name: Deploy Existing Server via FTP
    if: github.ref == 'refs/heads/sys-development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C deploy

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy files using FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -e

          : "${FTP_HOST:?FTP_HOST is missing}"
          : "${FTP_USERNAME:?FTP_USERNAME is missing}"
          : "${FTP_PASSWORD:?FTP_PASSWORD is missing}"
          : "${FTP_PORT:=21}"
          : "${FTP_REMOTE_DIR:=/}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -p "$FTP_PORT" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 2

          mirror --reverse \
            --ignore-time \
            --no-perms \
            --parallel=2 \
            --exclude-glob .github \
            --exclude-glob .env \
            --exclude-glob vendor \
            --exclude-glob runtime \
            deploy "$FTP_REMOTE_DIR"

          bye
          EOF

  # ==========================================
  # DIGITALOCEAN STAGING - SSH DEPLOYMENT
  # Trigger: main branch
  # ==========================================
  deploy-staging:
    name: Deploy DigitalOcean Staging via SSH
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Configure SSH known hosts
        env:
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$STAGING_KNOWN_HOSTS" ]; then
            echo "STAGING_KNOWN_HOSTS is missing"
            exit 1
          fi

          printf '%s\n' "$STAGING_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main branch to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          set -e

          : "${STAGING_HOST:?STAGING_HOST is missing}"
          : "${STAGING_USER:?STAGING_USER is missing}"
          : "${STAGING_PORT:=22}"

          ssh \
            -p "$STAGING_PORT" \
            -o BatchMode=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'cd /var/www/yii3 &&
             git fetch origin main &&
             git reset --hard origin/main &&
             composer install --no-dev --optimize-autoloader --no-interaction'
